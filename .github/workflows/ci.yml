name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test, clippy and no_std build
    runs-on: [self-hosted, sophie]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: riscv32imc-unknown-none-elf

      - name: Build all targets
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        run: cargo fmt --check

      - name: no_std build
        run: cargo build --target riscv32imc-unknown-none-elf --locked

  msrv:
    name: Rust 1.87 minimum supported version
    runs-on: [self-hosted, sophie]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: riscv32imc-unknown-none-elf

      - name: Build all targets
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      - name: no_std build
        run: cargo build --target riscv32imc-unknown-none-elf --locked

  release:
    name: Semantic release
    needs: [test, msrv]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, sophie]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 'lts/*'
          check-latest: true
          package-manager-cache: false

      - name: Semantic release
        uses: cycjimmy/semantic-release-action@v7.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
